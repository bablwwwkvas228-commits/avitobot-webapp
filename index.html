<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подписка на Авито Менеджер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #fefefe);
            --text-color: var(--tg-theme-text-color, #222222);
            --hint-color: var(--tg-theme-hint-color, #707579);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            margin-bottom: 4px;
            text-align: center;
        }

        .subtitle {
            color: var(--hint-color);
            font-size: 14px;
            text-align: center;
            margin-bottom: 24px;
        }

        .tariffs-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tariff-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .tariff-card.selected {
            border-color: var(--button-color);
        }

        .tariff-info h3 {
            margin: 0 0 4px 0;
            font-size: 16px;
        }

        .tariff-info p {
            margin: 0;
            font-size: 13px;
            color: var(--hint-color);
        }

        .tariff-price {
            font-weight: bold;
            font-size: 16px;
            color: var(--button-color);
        }

        .buy-btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 10px;
            padding: 14px;
            width: 100%;
            max-width: 400px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 24px;
            text-align: center;
        }

        .buy-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h2>💎 Выбор подписки</h2>
    <div class="subtitle">Выберите подходящий тариф для отслеживания объявлений</div>

    <div class="tariffs-container">
        <div class="tariff-card selected" onclick="selectTariff(this, '2', 0, 'free')">
            <div class="tariff-info">
                <h3>Пробный</h3>
                <p>2 дня • <b>2 поиска</b> с Авито</p>
            </div>
            <div class="tariff-price" style="color: #27ae60;">Бесплатно</div>
        </div>

        <div class="tariff-card" onclick="selectTariff(this, '30', 100, 'pay')">
            <div class="tariff-info">
                <h3>Месяц</h3>
                <p>30 дней • <b>5 поисков</b> с Авито</p>
            </div>
            <div class="tariff-price">⭐ 100</div>
        </div>

        <div class="tariff-card" onclick="selectTariff(this, '90', 200, 'pay')">
            <div class="tariff-info">
                <h3>3 месяца</h3>
                <p>90 дней • <b>15 поисков</b> с Авито</p>
            </div>
            <div class="tariff-price">⭐ 200</div>
        </div>

        <div class="tariff-card" onclick="selectTariff(this, '270', 500, 'pay')">
            <div class="tariff-info">
                <h3>9 месяцев</h3>
                <p>270 дней • <b>15 поисков</b> с Авито</p>
            </div>
            <div class="tariff-price">⭐ 500</div>
        </div>
    </div>

    <button class="buy-btn" id="payButton" onclick="buySubscription()">Активировать бесплатно</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const BOT_USERNAME = "Parrrs3r_Bot";

        let selectedDays = '2';
        let selectedStars = 0;
        let tariffType = 'free';

        function selectTariff(element, days, stars, type) {
            document.querySelectorAll('.tariff-card').forEach(card => card.classList.remove('selected'));
            element.classList.add('selected');
            selectedDays = days;
            selectedStars = stars;
            tariffType = type;

            const btn = document.getElementById('payButton');
            if (type === 'free') {
                btn.innerText = 'Активировать бесплатно';
            } else {
                btn.innerText = `Купить за ⭐ ${stars}`;
            }
        }

        function buySubscription() {
            if (tariffType === 'free') {
                tg.openTelegramLink(`https://t.me/${BOT_USERNAME}?start=free_${selectedDays}`);
            } else {
                tg.openTelegramLink(`https://t.me/${BOT_USERNAME}?start=buy_${selectedDays}_${selectedStars}`);
            }
            tg.close();
        }
    </script>
</body>
</html>
