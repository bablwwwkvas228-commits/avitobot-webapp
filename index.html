<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подписка FlipRadar</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #fefefe);
            --text-color: var(--tg-theme-text-color, #222222);
            --hint-color: var(--tg-theme-hint-color, #707579);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            margin-bottom: 4px;
            text-align: center;
        }

        .subtitle {
            color: var(--hint-color);
            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Переключатель категорий (Start / Pro) */
        .tabs {
            display: flex;
            width: 100%;
            max-width: 400px;
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 16px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            color: var(--hint-color);
        }

        .tab.active {
            background-color: var(--button-color);
            color: var(--button-text-color);
        }

        .tariffs-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tariff-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .tariff-card.selected {
            border-color: var(--button-color);
        }

        .tariff-info h3 {
            margin: 0 0 4px 0;
            font-size: 16px;
        }

        .tariff-info p {
            margin: 0;
            font-size: 12px;
            color: var(--hint-color);
            line-height: 1.4;
        }

        .tariff-price {
            font-weight: bold;
            font-size: 16px;
            color: var(--button-color);
            white-space: nowrap;
            margin-left: 10px;
        }

        .buy-btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 10px;
            padding: 14px;
            width: 100%;
            max-width: 400px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            text-align: center;
        }

        .buy-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h2>⚡ FlipRadar Тарифы</h2>
    <div class="subtitle">Выберите уровень и срок подписки</div>

    <!-- Вкладки выбора линейки -->
    <div class="tabs">
        <div class="tab active" id="tabStart" onclick="switchCategory('start')">Start (Базовый)</div>
        <div class="tab" id="tabPro" onclick="switchCategory('pro')">Pro (Всё включено)</div>
    </div>

    <div class="tariffs-container" id="tariffsList">
        <!-- Контент генерируется скриптом ниже -->
    </div>

    <button class="buy-btn" id="payButton" onclick="buySubscription()">Купить подписку</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const BOT_USERNAME = "Parrrs3r_Bot";

        // Данные по тарифам
        const tariffsData = {
            start: [
                { days: '30', stars: '100', name: 'Start • 1 месяц', desc: 'Мониторинг, фильтры, до 3 поисков' },
                { days: '90', stars: '250', name: 'Start • 3 месяца', desc: 'Мониторинг, фильтры, до 3 поисков (выгода)' },
                { days: '270', stars: '600', name: 'Start • 9 месяцев', desc: 'Мониторинг, фильтры, до 3 поисков (максимум)' }
            ],
            pro: [
                { days: '30', stars: '200', name: 'Pro • 1 месяц', desc: 'Мониторинг + Аналитика + Учёт сделок, до 15 поисков' },
                { days: '90', stars: '500', name: 'Pro • 3 месяца', desc: 'Мониторинг + Аналитика + Учёт сделок, до 15 поисков' },
                { days: '270', stars: '1200', name: 'Pro • 9 месяцев', desc: 'Мониторинг + Аналитика + Учёт сделок, до 15 поисков' }
            ]
        };

        let currentCategory = 'start';
        let selectedDays = '30';
        let selectedStars = '100';
        let selectedPlanName = 'Start • 1 месяц';

        function switchCategory(category) {
            currentCategory = category;
            document.getElementById('tabStart').classList.toggle('active', category === 'start');
            document.getElementById('tabPro').classList.toggle('active', category === 'pro');
            renderTariffs();
        }

        function renderTariffs() {
            const container = document.getElementById('tariffsList');
            container.innerHTML = '';
            
            const list = tariffsData[currentCategory];
            list.forEach((t, index) => {
                const isSelected = (index === 0);
                if (isSelected) {
                    selectedDays = t.days;
                    selectedStars = t.stars;
                    selectedPlanName = t.name;
                }

                const card = document.createElement('div');
                card.className = `tariff-card ${isSelected ? 'selected' : ''}`;
                card.onclick = () => selectTariff(card, t.days, t.stars, t.name);
                card.innerHTML = `
                    <div class="tariff-info">
                        <h3>${t.name}</h3>
                        <p>${t.desc}</p>
                    </div>
                    <div class="tariff-price">⭐ ${t.stars}</div>
                `;
                container.appendChild(card);
            });
            updateButtonText();
        }

        function selectTariff(element, days, stars, name) {
            document.querySelectorAll('.tariff-card').forEach(card => card.classList.remove('selected'));
            element.classList.add('selected');
            selectedDays = days;
            selectedStars = stars;
            selectedPlanName = name;
            updateButtonText();
        }

        function updateButtonText() {
            document.getElementById('payButton').innerText = `Купить ${selectedPlanName} за ⭐ ${selectedStars}`;
        }

        function buySubscription() {
            // Передаем план (start или pro), дни и звезды в бота
            tg.openTelegramLink(`https://t.me/${BOT_USERNAME}?start=buy_${currentCategory}_${selectedDays}_${selectedStars}`);
            tg.close();
        }

        // Инициализация при загрузке
        renderTariffs();
    </script>
</body>
</html>
